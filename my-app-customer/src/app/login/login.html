<form
  class="auth-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  [attr.aria-busy]="submitting()"
  novalidate
>
  <header class="auth-heading">
    <h1>Chào mừng bạn trở lại!</h1>
    <p>Đăng nhập để tiếp tục cùng iHOUZZ Uni</p>
  </header>

  <label class="auth-field" for="login-identifier">
    <span>Số điện thoại <b>*</b></span>
    <span class="auth-input-wrap">
      <app-icon name="phone" [size]="23" />
      <input
        id="login-identifier"
        type="tel"
        inputmode="tel"
        formControlName="username"
        autocomplete="tel"
        placeholder="Nhập số điện thoại"
        [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
      />
    </span>
    <small
      class="auth-error-inline"
      *ngIf="form.controls.username.touched && form.controls.username.hasError('required')"
      >Vui lòng nhập số điện thoại.</small
    >
    <small
      class="auth-error-inline"
      *ngIf="form.controls.username.touched && form.controls.username.hasError('pattern')"
      >Số điện thoại chưa đúng định dạng.</small
    >
  </label>

  <label class="auth-field" for="login-password">
    <span>Mật khẩu</span>
    <span class="auth-input-wrap">
      <app-icon name="lock" [size]="23" />
      <input
        #passwordInput
        id="login-password"
        formControlName="password"
        [type]="showPassword ? 'text' : 'password'"
        autocomplete="current-password"
        placeholder="Nhập mật khẩu"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <button
        class="auth-password-toggle"
        type="button"
        [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        [attr.aria-pressed]="showPassword"
        (pointerdown)="$event.preventDefault()"
        (click)="togglePassword(passwordInput)"
      >
        <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="23" />
      </button>
    </span>
    <app-form-error [control]="form.controls.password" />
  </label>

  <div class="auth-options">
    <label class="remember-phone" for="login-remember">
      <input id="login-remember" type="checkbox" formControlName="rememberMe" />
      <span>Ghi nhớ số điện thoại</span>
    </label>
    <a routerLink="/contact" title="Liên hệ để được quản trị viên hỗ trợ đặt lại mật khẩu."
      >Quên mật khẩu?</a
    >
  </div>

  <p class="auth-error" *ngIf="error()" role="alert">{{ error() }}</p>

  <button
    class="btn primary full auth-submit"
    type="submit"
    [disabled]="submitting()"
    [attr.aria-busy]="submitting()"
  >
    <span class="auth-spinner" *ngIf="submitting()" aria-hidden="true"></span>
    {{ submitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    <app-icon *ngIf="!submitting()" name="arrow" [size]="23" />
  </button>

  <p class="auth-switch">
    Chưa có tài khoản?
    <a routerLink="/register" [queryParams]="params">Đăng ký ngay</a>
  </p>
  <p class="auth-staff-note">Nhân viên và quản trị viên dùng tài khoản do công ty cấp.</p>
</form>
