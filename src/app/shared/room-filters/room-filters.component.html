<form class="filters" [class.hero-filter-layout]="heroSearch" (ngSubmit)="search.search()">
  <div class="primary-fields">
    <label *ngIf="!heroSearch"
      ><span>Từ khóa</span
      ><input
        name="q"
        placeholder="Tên phòng, mã hoặc địa chỉ"
        list="room-suggestions"
        [ngModel]="search.filter().query"
        (ngModelChange)="search.set({ query: $event })"
    /></label>
    <datalist *ngIf="!heroSearch" id="room-suggestions">
      <option *ngFor="let r of search.rooms.rooms()" [value]="r.name"></option>
    </datalist>
    <app-search-select
      label="Trường gần đó"
      placeholder="Tất cả trường"
      [value]="search.filter().schoolId || ''"
      [options]="schoolOptions"
      (valueChange)="search.school($event)"
    />
    <label
      ><span>Khu vực</span
      ><select
        name="district"
        [ngModel]="search.filter().district || ''"
        (ngModelChange)="search.set({ district: $event })"
      >
        <option value="">Tất cả khu vực</option>
        <option *ngFor="let d of districts">{{ d }}</option>
      </select></label
    >
    <label
      ><span>Khoảng giá</span
      ><select
        name="price"
        [ngModel]="search.filter().maxPrice || ''"
        (ngModelChange)="search.set({ maxPrice: +$event || undefined })"
      >
        <option value="">Mọi mức giá</option>
        <option [ngValue]="4000000">Đến 4 triệu</option>
        <option [ngValue]="6000000">Đến 6 triệu</option>
        <option [ngValue]="9000000">Đến 9 triệu</option>
      </select></label
    >
    <button
      class="btn filter-toggle"
      type="button"
      (click)="expanded = !expanded"
      [attr.aria-expanded]="expanded"
    >
      Bộ lọc <span class="badge">{{ search.count() }}</span>
    </button>
    <button *ngIf="!heroSearch" class="btn danger" type="submit" [disabled]="!!search.error()">
      <app-icon name="search" [size]="16" /> Tìm phòng
    </button>
  </div>
  <div class="filter-backdrop" *ngIf="expanded" (click)="expanded = false"></div>
  <section
    *ngIf="expanded"
    class="expanded"
    appDialogFocus
    aria-label="Bộ lọc mở rộng"
    (keydown.escape)="expanded = false"
  >
    <div class="row between">
      <h3>Chọn không gian phù hợp</h3>
      <button type="button" class="icon-btn" (click)="expanded = false" aria-label="Đóng bộ lọc">
        ×
      </button>
    </div>
    <div class="extra-fields">
      <app-search-select
        label="Tòa nhà minh họa"
        placeholder="Tất cả tòa nhà"
        [value]="search.filter().propertyId || ''"
        [options]="propertyOptions"
        (valueChange)="search.set({ propertyId: $event })"
      />
      <label
        ><span>Loại phòng</span
        ><select
          name="type"
          [ngModel]="search.filter().type || ''"
          (ngModelChange)="search.set({ type: $event })"
        >
          <option value="">Tất cả loại phòng</option>
          <option *ngFor="let t of types">{{ t }}</option>
        </select></label
      >
      <label
        ><span>Giá từ (đ/tháng)</span
        ><input
          type="number"
          min="0"
          name="minPrice"
          [ngModel]="search.filter().minPrice"
          (ngModelChange)="search.set({ minPrice: $event })"
      /></label>
      <label
        ><span>Giá đến (đ/tháng)</span
        ><input
          type="number"
          min="0"
          name="maxPrice"
          [ngModel]="search.filter().maxPrice"
          (ngModelChange)="search.set({ maxPrice: $event })"
      /></label>
      <label
        ><span>Diện tích từ (m²)</span
        ><input
          type="number"
          min="0"
          name="minArea"
          [ngModel]="search.filter().minArea"
          (ngModelChange)="search.set({ minArea: $event })"
      /></label>
      <label
        ><span>Diện tích đến (m²)</span
        ><input
          type="number"
          min="0"
          name="maxArea"
          [ngModel]="search.filter().maxArea"
          (ngModelChange)="search.set({ maxArea: $event })"
      /></label>
      <label
        ><span>Số người ở</span
        ><select
          name="capacity"
          [ngModel]="search.filter().capacity || ''"
          (ngModelChange)="search.set({ capacity: +$event || undefined })"
        >
          <option value="">Không giới hạn</option>
          <option *ngFor="let c of capacities" [value]="c">Đủ chỗ cho {{ c }} người</option>
        </select></label
      >
      <label
        ><span>Trạng thái phòng</span
        ><select
          name="status"
          [ngModel]="search.filter().status || ''"
          (ngModelChange)="search.set({ status: $event })"
        >
          <option value="">Tất cả trạng thái</option>
          <option value="AVAILABLE">Đang trống</option>
          <option value="HELD">Đã giữ chỗ</option>
          <option value="RENTED">Đã thuê</option>
        </select></label
      >
      <label *ngIf="distanceAvailable"
        ><span>Bán kính đường thẳng</span
        ><select
          name="radius"
          [ngModel]="search.filter().radius || ''"
          (ngModelChange)="search.set({ radius: +$event || undefined })"
        >
          <option value="">Mọi khoảng cách</option>
          <option value="1">1 km</option>
          <option value="3">3 km</option>
          <option value="5">5 km</option>
        </select></label
      >
    </div>
    <fieldset>
      <legend>Tiện nghi</legend>
      <label class="amenity" *ngFor="let a of amenities"
        ><input
          type="checkbox"
          [checked]="search.filter().amenities?.includes(a)"
          (change)="amenity(a, $any($event.target).checked)"
        />
        {{ a }}</label
      >
    </fieldset>
    <p class="error" role="alert" *ngIf="search.error()">{{ search.error() }}</p>
    <div class="row between">
      <button type="button" class="btn" (click)="search.clear()">Xóa tất cả</button
      ><button type="button" class="btn primary" (click)="expanded = false">
        Xem {{ search.results().length }} kết quả
      </button>
    </div>
  </section>
  <p class="error" role="alert" *ngIf="!expanded && search.error()">{{ search.error() }}</p>
  <div class="filter-summary" aria-live="polite">
    <strong>{{ search.results().length }} phòng phù hợp</strong
    ><button
      *ngFor="let chip of search.chips()"
      type="button"
      class="tag chip"
      (click)="search.remove(chip.key)"
      [attr.aria-label]="'Bỏ lọc ' + chip.label"
    >
      {{ chip.label }} ×</button
    ><button type="button" *ngIf="search.count()" class="clear" (click)="search.clear()">
      Xóa tất cả ({{ search.count() }})
    </button>
  </div>
</form>
