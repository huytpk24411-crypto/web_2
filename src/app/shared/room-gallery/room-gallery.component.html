<div class="gallery" [class.single]="images.length === 1">
  <button class="gallery-main" (click)="show(0)" aria-label="Mở thư viện ảnh phòng">
    <img [src]="images[0]" [alt]="room.name + ' – ảnh bìa minh họa'" appImageFallback /><span
      class="badge"
      >{{ room.code }}</span
    >
  </button>
  <div class="gallery-side" *ngIf="images.length > 1">
    <button
      *ngFor="let img of images.slice(1, 3); let i = index"
      (click)="show(i + 1)"
      [attr.aria-label]="'Xem ảnh phòng ' + (i + 2)"
    >
      <img [src]="img" [alt]="room.name + ' – ảnh ' + (i + 2)" appImageFallback />
    </button>
  </div>
  <button class="btn all-photos" (click)="show(0)">
    <app-icon name="image" [size]="16" /> Xem {{ images.length }} ảnh
  </button>
</div>
<p class="gallery-caption">
  Ảnh minh họa theo nhóm nội thất cho đồ án · chưa phải bộ ảnh xác nhận của căn phòng thực tế.
</p>
<div class="modal-backdrop gallery-backdrop" *ngIf="open()" (click)="open.set(false)">
  <section
    class="gallery-modal"
    appDialogFocus
    role="dialog"
    aria-modal="true"
    aria-label="Thư viện ảnh phòng"
    (click)="$event.stopPropagation()"
    (keydown)="key($event)"
  >
    <button class="icon-btn close" (click)="open.set(false)" aria-label="Đóng thư viện">×</button
    ><img
      class="large-image"
      [src]="images[active()]"
      [alt]="room.name + ' – ảnh minh họa ' + (active() + 1)"
      appImageFallback
    />
    <div class="gallery-nav">
      <button *ngIf="images.length > 1" class="btn" (click)="next(-1)" aria-label="Ảnh trước">
        ‹</button
      ><span aria-live="polite">{{ active() + 1 }} / {{ images.length }}</span
      ><button *ngIf="images.length > 1" class="btn" (click)="next(1)" aria-label="Ảnh sau">
        ›
      </button>
    </div>
    <div class="thumbnails" *ngIf="images.length > 1">
      <button
        *ngFor="let img of images; let i = index"
        (click)="active.set(i)"
        [class.active]="i === active()"
        [attr.aria-label]="'Chọn ảnh ' + (i + 1)"
        [attr.aria-pressed]="i === active()"
      >
        <img [src]="img" [alt]="'Ảnh thu nhỏ ' + (i + 1)" appImageFallback />
      </button>
    </div>
  </section>
</div>
