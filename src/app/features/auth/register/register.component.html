<section class="auth-page auth-page-register">
  <aside class="auth-visual">
    <img
      class="auth-room-image"
      src="/assets/auth/auth-room.png"
      alt="Ảnh minh họa căn phòng sáng với giường ngủ, bàn học và cửa sổ"
      appImageFallback
      fetchpriority="high"
      width="768"
      height="960"
    />
    <div class="auth-visual-copy">
      <h2>Một nơi ở tốt.<br />Một khởi đầu mới.</h2>
      <span class="auth-accent" aria-hidden="true"></span>
    </div>
  </aside>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="auth-heading">
      <h1>Tạo tài khoản</h1>
      <p>Lưu phòng yêu thích và chủ động đặt lịch xem</p>
    </header>


    <label class="auth-field" for="register-name">
      <span>Họ và tên <b>*</b></span>
      <span class="auth-input-wrap">
        <app-icon name="user" [size]="17" />
        <input
          id="register-name"
          formControlName="name"
          autocomplete="name"
          placeholder="Nhập họ và tên của bạn"
          [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched"
        />
      </span>
      <app-form-error [control]="form.controls.name" />
    </label>

    <label class="auth-field" for="register-username">
      <span>Tên đăng nhập <b>*</b></span>
      <span class="auth-input-wrap">
        <app-icon name="user" [size]="17" />
        <input
          id="register-username"
          formControlName="username"
          autocomplete="username"
          placeholder="Tạo tên đăng nhập"
          [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
      </span>
      <small
        class="auth-error-inline"
        *ngIf="form.controls.username.touched && form.controls.username.hasError('required')"
        >Vui lòng nhập tên đăng nhập.</small
      >
      <small
        class="auth-error-inline"
        *ngIf="form.controls.username.touched && form.controls.username.hasError('pattern')"
        >Tên đăng nhập gồm 3–30 ký tự, bắt đầu bằng chữ và chỉ dùng chữ, số, _ hoặc -.</small
      >
      <small class="auth-hint">3–30 ký tự; bắt đầu bằng chữ, dùng chữ, số, _ hoặc -.</small>
    </label>

    <label class="auth-field" for="register-phone">
      <span>Số điện thoại <b>*</b></span>
      <span class="auth-input-wrap">
        <app-icon name="phone" [size]="17" />
        <input
          id="register-phone"
          type="tel"
          formControlName="phone"
          autocomplete="tel"
          inputmode="tel"
          placeholder="Nhập số điện thoại"
          [attr.aria-invalid]="form.controls.phone.invalid && form.controls.phone.touched"
        />
      </span>
      <app-form-error [control]="form.controls.phone" />
    </label>

    <div class="auth-password-row">
      <label class="auth-field" for="register-password">
        <span>Mật khẩu <b>*</b></span>
        <span class="auth-input-wrap">
          <app-icon name="lock" [size]="17" />
          <input
            id="register-password"
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Tạo mật khẩu"
            [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
        <app-form-error [control]="form.controls.password" />
        <small class="auth-hint">Ít nhất 8 ký tự.</small>
      </label>

      <label class="auth-field" for="register-confirm">
        <span>Xác nhận mật khẩu <b>*</b></span>
        <span class="auth-input-wrap">
          <app-icon name="lock" [size]="17" />
          <input
            id="register-confirm"
            formControlName="confirm"
            [type]="showConfirmPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Nhập lại mật khẩu"
            [attr.aria-invalid]="
              (form.controls.confirm.invalid || form.hasError('passwordMismatch')) &&
              form.controls.confirm.touched
            "
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="
              showConfirmPassword ? 'Ẩn xác nhận mật khẩu' : 'Hiện xác nhận mật khẩu'
            "
            [attr.aria-pressed]="showConfirmPassword"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            <app-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
        <app-form-error [control]="form.controls.confirm" />
        <small
          class="auth-error-inline"
          *ngIf="form.hasError('passwordMismatch') && form.controls.confirm.touched"
          >Mật khẩu xác nhận chưa khớp.</small
        >
      </label>
    </div>

    <p class="auth-error" *ngIf="error" role="alert">{{ error }}</p>

    <button class="btn primary full auth-submit" type="submit" [disabled]="submitting">
      {{ submitting ? 'Đang tạo tài khoản...' : 'Tạo tài khoản' }}
      <app-icon name="arrow" [size]="16" />
    </button>

    <p class="auth-switch">
      Đã có tài khoản?
      <a routerLink="/login" [queryParams]="params">Đăng nhập</a>
    </p>
  </form>
</section>
