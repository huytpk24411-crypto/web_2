<app-map-search [compact]="true" />
<section class="container section">
  <div class="section-heading">
    <div>
      <h1>Tất cả phòng</h1>
      <p class="muted small">{{ results.length }} phòng phù hợp · tin đang hiển thị và phòng đang trống</p>
    </div>
    <label class="sort"
      ><span class="sr-only">Sắp xếp phòng</span
      ><select
        class="control"
        [ngModel]="search.filter().sort || ''"
        (ngModelChange)="search.set({ sort: $event })"
      >
        <option value="">Thứ tự mặc định</option>
        <option value="price-asc">Giá thấp đến cao</option>
        <option value="price-desc">Giá cao đến thấp</option>
      </select></label
    >
  </div>
  <div class="empty" *ngIf="search.rooms.loading()">Đang tải phòng...</div>
  <div class="notice error" *ngIf="search.rooms.error()">{{ search.rooms.error() }} <button class="btn sm" (click)="search.rooms.refresh()">Thử lại</button></div>
  <div class="room-grid" *ngIf="!search.rooms.loading() && !search.rooms.error()">
    <app-room-card *ngFor="let room of results.slice((page - 1) * 8, page * 8)" [room]="room" />
  </div>
  <div class="empty" *ngIf="!results.length">
    <app-icon name="search" [size]="38" />
    <h2>Chưa tìm thấy phòng phù hợp</h2>
    <p>Thử đổi bộ lọc hoặc quay lại sau khi có tin phòng phù hợp.</p>
    <button class="btn primary" (click)="reset()">Xem tất cả phòng</button>
  </div>
  <div class="pagination" *ngIf="pages.length > 1">
    <button (click)="page = page - 1" [disabled]="page === 1" aria-label="Trang trước">‹</button
    ><button
      *ngFor="let n of pages"
      (click)="page = n"
      [class.active]="page === n"
      [attr.aria-label]="'Trang ' + n"
      [attr.aria-current]="page === n ? 'page' : null"
    >
      {{ n }}</button
    ><button (click)="page = page + 1" [disabled]="page === pages.length" aria-label="Trang sau">
      ›
    </button>
  </div>
</section>
