<section class="not-found">
  <app-icon name="shield" [size]="48" />
  <h1>Bạn chưa có quyền truy cập</h1>
  <p class="muted">Tài khoản hiện tại không có vai trò phù hợp với khu vực này.</p>
  <button *ngIf="auth.account()" class="btn" (click)="logout()">Đăng xuất</button>
  <a [routerLink]="auth.destination()" class="btn primary">Về khu vực của tôi</a>
</section>
