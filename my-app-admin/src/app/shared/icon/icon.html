<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  [attr.fill]="name === 'flame' ? 'currentColor' : 'none'"
  [attr.stroke]="name === 'flame' ? 'none' : 'currentColor'"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <path [attr.d]="paths[name] || paths['home']" />
</svg>
